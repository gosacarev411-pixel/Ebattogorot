<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Telegram Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #1a0033 100%);
    color: #fff;
    min-height: 100vh;
    padding: 16px;
    overflow-x: hidden;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .logo {
    font-size: 48px;
    margin-bottom: 8px;
  }
  .balance-box {
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #000;
    padding: 12px 24px;
    border-radius: 30px;
    display: inline-block;
    font-weight: 800;
    font-size: 20px;
    box-shadow: 0 4px 20px rgba(255,215,0,0.4);
  }
  .games {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 500px;
    margin: 0 auto;
  }
  .game-card {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(10px);
  }
  .game-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }
  .game-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  
  /* Slots */
  .slots-display {
    display: flex;
    gap: 8px;
    font-size: 48px;
    background: rgba(0,0,0,0.4);
    padding: 16px 24px;
    border-radius: 12px;
    min-width: 200px;
    justify-content: center;
  }
  .slot {
    animation: spin 0.1s linear infinite;
  }
  .slot.stopped { animation: none; }
  @keyframes spin {
    0% { transform: translateY(-10px); opacity: 0.5; }
    50% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(10px); opacity: 0.5; }
  }
  
  /* Roulette */
  .roulette-wheel {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: conic-gradient(
      #e74c3c 0deg 180deg,
      #2c3e50 180deg 360deg
    );
    border: 4px solid #ffd700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 800;
    transition: transform 2s cubic-bezier(0.17, 0.67, 0.21, 0.99);
  }
  .roulette-result {
    font-size: 20px;
    font-weight: 700;
    min-height: 30px;
  }
  
  /* Coin Flip */
  .coin {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    box-shadow: 0 4px 20px rgba(255,215,0,0.5);
    transition: transform 1s ease;
  }
  .coin.flipping {
    animation: flip 1s ease;
  }
  @keyframes flip {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(1800deg); }
  }
  
  /* Crash Game */
  .crash-display {
    width: 100%;
    max-width: 400px;
    height: 200px;
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
  }
  .crash-graph {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .crash-multiplier {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 56px;
    font-weight: 900;
    color: #00ff88;
    text-shadow: 0 0 20px rgba(0,255,136,0.8);
    z-index: 10;
  }
  .crash-multiplier.crashed {
    color: #ff4444;
    text-shadow: 0 0 20px rgba(255,68,68,0.8);
    animation: shake 0.5s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translate(-50%, -50%); }
    25% { transform: translate(-52%, -50%); }
    75% { transform: translate(-48%, -50%); }
  }
  .crash-rocket {
    position: absolute;
    font-size: 48px;
    transition: all 0.1s linear;
    z-index: 5;
  }
  .crash-rocket.exploded {
    animation: explode 0.5s ease forwards;
  }
  @keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }
  .crash-line {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, #00ff88, #00d4ff);
    box-shadow: 0 0 10px rgba(0,255,136,0.8);
    transition: width 0.1s linear;
  }
  
  /* Controls */
  .bet-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 300px;
  }
  .bet-input {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 10px;
    color: #fff;
    font-size: 16px;
    text-align: center;
    font-weight: 700;
  }
  .bet-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .bet-btn:active { transform: scale(0.95); }
  
  .play-btn {
    background: linear-gradient(135deg, #00d4ff, #0099cc);
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,212,255,0.4);
    transition: all 0.2s;
    width: 100%;
    max-width: 300px;
  }
  .play-btn:active { transform: scale(0.97); }
  .play-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .play-btn.cashout {
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    box-shadow: 0 4px 15px rgba(0,255,136,0.4);
    animation: pulse 1s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  .choice-btns {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 300px;
  }
  .choice-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .choice-btn.red { background: #e74c3c; color: #fff; }
  .choice-btn.black { background: #2c3e50; color: #fff; }
  .choice-btn:active { transform: scale(0.95); }
  
  .message {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    min-height: 28px;
    margin-top: 8px;
  }
  .message.win { color: #00ff88; }
  .message.lose { color: #ff4444; }
  
  .daily-bonus {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    max-width: 500px;
    margin: 0 auto 20px;
    box-shadow: 0 4px 15px rgba(255,107,107,0.4);
  }
  .daily-bonus:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">🎰</div>
    <div class="balance-box">💰 <span id="balance">1000</span></div>
  </div>

  <button class="daily-bonus" id="dailyBonus">🎁 Забрать ежедневный бонус +500</button>

  <div class="games">
    <!-- Crash Game -->
    <div class="game-card">
      <div class="game-title">🚀 Crash</div>
      <div class="game-content">
        <div class="crash-display">
          <div class="crash-line" id="crashLine"></div>
          <div class="crash-multiplier" id="crashMultiplier">1.00x</div>
          <div class="crash-rocket" id="crashRocket">🚀</div>
        </div>
        <div class="bet-controls">
          <button class="bet-btn" onclick="changeBet('crash', -10)">-10</button>
          <input type="number" class="bet-input" id="crashBet" value="50" min="10">
          <button class="bet-btn" onclick="changeBet('crash', 10)">+10</button>
        </div>
        <button class="play-btn" id="crashPlay">Старт</button>
        <div class="message" id="crashMsg"></div>
      </div>
    </div>

    <!-- Slots -->
    <div class="game-card">
      <div class="game-title">🎰 Слоты</div>
      <div class="game-content">
        <div class="slots-display">
          <span class="slot stopped" id="slot1">🍒</span>
          <span class="slot stopped" id="slot2">🍋</span>
          <span class="slot stopped" id="slot3">🔔</span>
        </div>
        <div class="bet-controls">
          <button class="bet-btn" onclick="changeBet('slots', -10)">-10</button>
          <input type="number" class="bet-input" id="slotsBet" value="50" min="10">
          <button class="bet-btn" onclick="changeBet('slots', 10)">+10</button>
        </div>
        <button class="play-btn" id="slotsPlay">Крутить</button>
        <div class="message" id="slotsMsg"></div>
      </div>
    </div>

    <!-- Roulette -->
    <div class="game-card">
      <div class="game-title">🎡 Рулетка</div>
      <div class="game-content">
        <div class="roulette-wheel" id="rouletteWheel">?</div>
        <div class="roulette-result" id="rouletteResult"></div>
        <div class="bet-controls">
          <button class="bet-btn" onclick="changeBet('roulette', -10)">-10</button>
          <input type="number" class="bet-input" id="rouletteBet" value="50" min="10">
          <button class="bet-btn" onclick="changeBet('roulette', 10)">+10</button>
        </div>
        <div class="choice-btns">
          <button class="choice-btn red" id="betRed">Красное x2</button>
          <button class="choice-btn black" id="betBlack">Чёрное x2</button>
        </div>
        <div class="message" id="rouletteMsg"></div>
      </div>
    </div>

    <!-- Coin Flip -->
    <div class="game-card">
      <div class="game-title">🪙 Монетка</div>
      <div class="game-content">
        <div class="coin" id="coin">🪙</div>
        <div class="bet-controls">
          <button class="bet-btn" onclick="changeBet('coin', -10)">-10</button>
          <input type="number" class="bet-input" id="coinBet" value="50" min="10">
          <button class="bet-btn" onclick="changeBet('coin', 10)">+10</button>
        </div>
        <div class="choice-btns">
          <button class="choice-btn red" id="betHeads">Орёл x2</button>
          <button class="choice-btn black" id="betTails">Решка x2</button>
        </div>
        <div class="message" id="coinMsg"></div>
      </div>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor?.('#1a0033');
    tg.setBackgroundColor?.('#1a0033');
  }

  // Состояние
  let state = {
    balance: 1000,
    lastBonus: 0
  };

  const saved = JSON.parse(localStorage.getItem('casino') || '{}');
  Object.assign(state, saved);

  const $ = id => document.getElementById(id);
  const balanceEl = $('balance');

  function render() {
    balanceEl.textContent = state.balance.toLocaleString('ru-RU');
    
    const now = Date.now();
    const canClaim = now - state.lastBonus > 24 * 60 * 60 * 1000;
    $('dailyBonus').disabled = !canClaim;
    if (!canClaim) {
      const hoursLeft = Math.ceil((24 * 60 * 60 * 1000 - (now - state.lastBonus)) / (60 * 60 * 1000));
      $('dailyBonus').textContent = `🎁 Бонус доступен через ${hoursLeft}ч`;
    } else {
      $('dailyBonus').textContent = '🎁 Забрать ежедневный бонус +500';
    }
  }

  function save() {
    localStorage.setItem('casino', JSON.stringify(state));
  }

  function changeBet(game, delta) {
    const input = $(game + 'Bet');
    let val = parseInt(input.value) + delta;
    if (val < 10) val = 10;
    if (val > state.balance) val = state.balance;
    input.value = val;
  }

  function updateBalance(amount) {
    state.balance += amount;
    if (state.balance < 0) state.balance = 0;
    render();
    save();
    tg?.HapticFeedback?.notificationOccurred(amount > 0 ? 'success' : 'error');
  }

  // Ежедневный бонус
  $('dailyBonus').addEventListener('click', () => {
    const now = Date.now();
    if (now - state.lastBonus < 24 * 60 * 60 * 1000) return;
    state.lastBonus = now;
    updateBalance(500);
    $('dailyBonus').disabled = true;
    render();
  });

  // === CRASH GAME ===
  let crashRunning = false;
  let crashMultiplier = 1.0;
  let crashPoint = 0;
  let crashInterval = null;
  let crashBetAmount = 0;

  function generateCrashPoint() {
    // Формула с house edge ~3%
    // Чем выше множитель, тем меньше вероятность
    const r = Math.random();
    if (r < 0.03) return 1.0; // 3% шанс мгновенного краша
    return Math.max(1.0, 1 / (1 - r) * 0.97);
  }

  function startCrash() {
    if (crashRunning) return;
    
    const bet = parseInt($('crashBet').value);
    if (bet > state.balance) {
      $('crashMsg').textContent = 'Недостаточно монет!';
      $('crashMsg').className = 'message lose';
      return;
    }

    crashRunning = true;
    crashBetAmount = bet;
    crashMultiplier = 1.0;
    crashPoint = generateCrashPoint();
    
    updateBalance(-bet);
    
    const playBtn = $('crashPlay');
    playBtn.textContent = 'Забрать';
    playBtn.classList.add('cashout');
    $('crashMsg').textContent = '';
    
    const multiplier = $('crashMultiplier');
    const rocket = $('crashRocket');
    const line = $('crashLine');
    
    multiplier.classList.remove('crashed');
    rocket.classList.remove('exploded');
    rocket.style.bottom = '10px';
    rocket.style.left = '10px';
    
    let progress = 0;
    
    crashInterval = setInterval(() => {
      crashMultiplier += 0.01 + (crashMultiplier * 0.005);
      multiplier.textContent = crashMultiplier.toFixed(2) + 'x';
      
      // Двигаем ракету
      progress += 2;
      const display = document.querySelector('.crash-display');
      const maxX = display.offsetWidth - 60;
      const maxY = display.offsetHeight - 60;
      
      const x = Math.min(progress, maxX);
      const y = Math.min(progress * 0.8, maxY);
      
      rocket.style.left = x + 'px';
      rocket.style.bottom = y + 'px';
      
      // Линия графика
      line.style.width = Math.min(progress * 2, display.offsetWidth) + 'px';
      
      // Проверка краша
      if (crashMultiplier >= crashPoint) {
        crash();
      }
    }, 100);
  }

  function cashout() {
    if (!crashRunning) return;
    
    clearInterval(crashInterval);
    crashRunning = false;
    
    const winAmount = Math.floor(crashBetAmount * crashMultiplier);
    updateBalance(winAmount);
    
    $('crashMsg').textContent = `🎉 Забрал ${winAmount} монет!`;
    $('crashMsg').className = 'message win';
    
    resetCrashUI();
  }

  function crash() {
    clearInterval(crashInterval);
    crashRunning = false;
    
    const multiplier = $('crashMultiplier');
    const rocket = $('crashRocket');
    
    multiplier.textContent = crashMultiplier.toFixed(2) + 'x';
    multiplier.classList.add('crashed');
    rocket.classList.add('exploded');
    
    $('crashMsg').textContent = `💥 Краш на ${crashMultiplier.toFixed(2)}x!`;
    $('crashMsg').className = 'message lose';
    
    setTimeout(() => {
      resetCrashUI();
    }, 2000);
  }

  function resetCrashUI() {
    const playBtn = $('crashPlay');
    playBtn.textContent = 'Старт';
    playBtn.classList.remove('cashout');
    
    $('crashMultiplier').textContent = '1.00x';
    $('crashLine').style.width = '0';
  }

  $('crashPlay').addEventListener('click', () => {
    if (crashRunning) {
      cashout();
    } else {
      startCrash();
    }
  });

  // === СЛОТЫ ===
  const symbols = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];
  let slotsSpinning = false;

  $('slotsPlay').addEventListener('click', () => {
    if (slotsSpinning) return;
    const bet = parseInt($('slotsBet').value);
    if (bet > state.balance) {
      $('slotsMsg').textContent = 'Недостаточно монет!';
      $('slotsMsg').className = 'message lose';
      return;
    }
    
    slotsSpinning = true;
    $('slotsPlay').disabled = true;
    $('slotsMsg').textContent = '';
    updateBalance(-bet);

    const slots = [$('slot1'), $('slot2'), $('slot3')];
    slots.forEach(s => s.classList.remove('stopped'));

    let spinCount = 0;
    const spinInterval = setInterval(() => {
      slots.forEach(s => {
        s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      });
      spinCount++;
    }, 100);

    setTimeout(() => {
      clearInterval(spinInterval);
      
      const results = [
        symbols[Math.floor(Math.random() * symbols.length)],
        symbols[Math.floor(Math.random() * symbols.length)],
        symbols[Math.floor(Math.random() * symbols.length)]
      ];
      
      slots.forEach((s, i) => {
        s.textContent = results[i];
        s.classList.add('stopped');
      });

      let winAmount = 0;
      if (results[0] === results[1] && results[1] === results[2]) {
        winAmount = bet * 10;
        $('slotsMsg').textContent = `🎉 ДЖЕКПОТ! +${winAmount}`;
        $('slotsMsg').className = 'message win';
      } else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
        winAmount = bet * 2;
        $('slotsMsg').textContent = `✨ Выигрыш! +${winAmount}`;
        $('slotsMsg').className = 'message win';
      } else {
        $('slotsMsg').textContent = 'Попробуй ещё раз!';
        $('slotsMsg').className = 'message lose';
      }

      if (winAmount > 0) updateBalance(winAmount);
      
      slotsSpinning = false;
      $('slotsPlay').disabled = false;
    }, 2000);
  });

  // === РУЛЕТКА ===
  let rouletteSpinning = false;

  function playRoulette(choice) {
    if (rouletteSpinning) return;
    const bet = parseInt($('rouletteBet').value);
    if (bet > state.balance) {
      $('rouletteMsg').textContent = 'Недостаточно монет!';
      $('rouletteMsg').className = 'message lose';
      return;
    }

    rouletteSpinning = true;
    $('betRed').disabled = true;
    $('betBlack').disabled = true;
    $('rouletteMsg').textContent = '';
    updateBalance(-bet);

    const wheel = $('rouletteWheel');
    const rotation = 1440 + Math.random() * 360;
    wheel.style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
      const isRed = Math.random() < 0.5;
      const result = isRed ? 'red' : 'black';
      
      wheel.textContent = isRed ? '🔴' : '⚫';
      $('rouletteResult').textContent = isRed ? 'Красное' : 'Чёрное';

      if (choice === result) {
        const win = bet * 2;
        $('rouletteMsg').textContent = `🎉 Выигрыш! +${win}`;
        $('rouletteMsg').className = 'message win';
        updateBalance(win);
      } else {
        $('rouletteMsg').textContent = 'Не повезло!';
        $('rouletteMsg').className = 'message lose';
      }

      rouletteSpinning = false;
      $('betRed').disabled = false;
      $('betBlack').disabled = false;
    }, 2000);
  }

  $('betRed').addEventListener('click', () => playRoulette('red'));
  $('betBlack').addEventListener('click', () => playRoulette('black'));

  // === МОНЕТКА ===
  let coinFlipping = false;

  function playCoin(choice) {
    if (coinFlipping) return;
    const bet = parseInt($('coinBet').value);
    if (bet > state.balance) {
      $('coinMsg').textContent = 'Недостаточно монет!';
      $('coinMsg').className = 'message lose';
      return;
    }

    coinFlipping = true;
    $('betHeads').disabled = true;
    $('betTails').disabled = true;
    $('coinMsg').textContent = '';
    updateBalance(-bet);

    const coin = $('coin');
    coin.classList.add('flipping');

    setTimeout(() => {
      const isHeads = Math.random() < 0.5;
      const result = isHeads ? 'heads' : 'tails';
      
      coin.textContent = isHeads ? '👑' : '🌟';
      coin.classList.remove('flipping');

      if (choice === result) {
        const win = bet * 2;
        $('coinMsg').textContent = `🎉 Выигрыш! +${win}`;
        $('coinMsg').className = 'message win';
        updateBalance(win);
      } else {
        $('coinMsg').textContent = 'Не повезло!';
        $('coinMsg').className = 'message lose';
      }

      coinFlipping = false;
      $('betHeads').disabled = false;
      $('betTails').disabled = false;
    }, 1000);
  }

  $('betHeads').addEventListener('click', () => playCoin('heads'));
  $('betTails').addEventListener('click', () => playCoin('tails'));

  render();
</script>
</body>
</html>
