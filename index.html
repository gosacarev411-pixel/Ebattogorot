<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hamster Clone - Crypto Clicker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .level-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .level-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .profit-per-hour {
            background: rgba(0,255,0,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #00ff88;
        }

        .balance-container {
            text-align: center;
            margin: 20px 0;
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .balance {
            font-size: 42px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .coin-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .energy-container {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .energy-bar {
            background: rgba(255,255,255,0.2);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .energy-fill {
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            height: 100%;
            transition: width 0.3s;
            border-radius: 10px;
        }

        /* Main Clicker Area */
        .clicker-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            min-height: 300px;
        }

        .hamster-btn {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 150px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.4), inset 0 -10px 30px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            position: relative;
            border: 8px solid #fff;
        }

        .hamster-btn:active {
            transform: scale(0.95);
        }

        .hamster-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
        }

        .click-effect {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(22, 33, 62, 0.98);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 5px 15px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 10px;
        }

        .nav-item.active {
            background: rgba(102, 126, 234, 0.3);
            color: #667eea;
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* Sections */
        .section {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Cards/Mine Section */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-category {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .category-name {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }

        .category-profit {
            font-size: 12px;
            color: #00ff88;
        }

        .card-item {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .card-item:hover {
            transform: translateX(5px);
            border-color: #667eea;
        }

        .card-item.purchased {
            opacity: 0.6;
            border-color: #00ff88;
        }

        .card-info {
            flex: 1;
        }

        .card-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .card-profit {
            font-size: 12px;
            color: #00ff88;
        }

        .card-price {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .card-item.purchased .card-price {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #fff;
        }

        /* Friends Section */
        .friends-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .friend-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .friend-info {
            flex: 1;
        }

        .friend-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .friend-earnings {
            font-size: 12px;
            color: #00ff88;
        }

        .invite-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Tasks Section */
        .task-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .task-reward {
            font-size: 12px;
            color: #ffd700;
        }

        .claim-btn {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .claim-btn.completed {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 2px solid #667eea;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .modal-text {
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .modal-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .hamster-btn {
                width: 240px;
                height: 240px;
                font-size: 120px;
            }
            
            .balance {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="level-info">
            <div class="level-badge"> Level <span id="level">1</span></div>
            <div class="profit-per-hour">💰 <span id="profitHour">0</span>/час</div>
        </div>
        
        <div class="balance-container">
            <div class="balance-label">Ваш баланс</div>
            <div class="balance">
                <div class="coin-icon">🪙</div>
                <span id="balance">0</span>
            </div>
        </div>
        
        <div class="energy-container">
            <div class="energy-info">
                <span> Энергия</span>
                <span><span id="energy">1000</span>/<span id="maxEnergy">1000</span></span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyBar" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <!-- Main Clicker Section -->
    <div id="exchangeSection" class="section active">
        <div class="clicker-area">
            <div class="hamster-btn" id="hamsterBtn"></div>
        </div>
    </div>

    <!-- Mine/Cards Section -->
    <div id="mineSection" class="section">
        <div class="section-title"> Майнинг ферма</div>
        <div class="cards-container" id="cardsContainer"></div>
    </div>

    <!-- Friends Section -->
    <div id="friendsSection" class="section">
        <div class="section-title">👥 Друзья</div>
        <div style="background: rgba(102,126,234,0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center;">
            <div style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">Пригласи друзей</div>
            <div style="font-size: 14px; opacity: 0.8; margin-bottom: 15px;">Получай 10% от их заработка</div>
            <button class="invite-btn" onclick="inviteFriend()">📩 Пригласить</button>
        </div>
        <div class="friends-list" id="friendsList"></div>
    </div>

    <!-- Tasks Section -->
    <div id="tasksSection" class="section">
        <div class="section-title">📋 Задания</div>
        <div id="tasksContainer"></div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('exchange')">
            <div class="nav-icon"></div>
            <div class="nav-label">Биржа</div>
        </div>
        <div class="nav-item" onclick="switchTab('mine')">
            <div class="nav-icon">⛏️</div>
            <div class="nav-label">Шахта</div>
        </div>
        <div class="nav-item" onclick="switchTab('friends')">
            <div class="nav-icon">👥</div>
            <div class="nav-label">Друзья</div>
        </div>
        <div class="nav-item" onclick="switchTab('tasks')">
            <div class="nav-icon">📋</div>
            <div class="nav-label">Задания</div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">🎉 Поздравляем!</div>
            <div class="modal-text" id="modalText"></div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        // Game State
        let gameState = {
            balance: 0,
            energy: 1000,
            maxEnergy: 1000,
            level: 1,
            profitPerHour: 0,
            clickValue: 1,
            cards: [],
            tasks: [],
            friends: [],
            lastSave: Date.now()
        };

        // Cards Data
        const cardsData = [
            {
                category: "Рынки",
                items: [
                    { id: 'c1', name: 'Форекс', profit: 100, price: 100, icon: '' },
                    { id: 'c2', name: 'Криптобиржа', profit: 500, price: 1000, icon: '' },
                    { id: 'c3', name: 'Акции', profit: 1000, price: 5000, icon: '📈' }
                ]
            },
            {
                category: "IT и стартапы",
                items: [
                    { id: 'c4', name: 'Веб-студия', profit: 2000, price: 10000, icon: '💻' },
                    { id: 'c5', name: 'Мобильное приложение', profit: 5000, price: 25000, icon: '📱' },
                    { id: 'c6', name: 'AI стартап', profit: 10000, price: 50000, icon: '🤖' }
                ]
            },
            {
                category: "Недвижимость",
                items: [
                    { id: 'c7', name: 'Квартира', profit: 15000, price: 100000, icon: '' },
                    { id: 'c8', name: 'Офис', profit: 30000, price: 250000, icon: '🏢' },
                    { id: 'c9', name: 'ТЦ', profit: 75000, price: 500000, icon: '️' }
                ]
            },
            {
                category: "Крипта",
                items: [
                    { id: 'c10', name: 'Майнинг ферма', profit: 50000, price: 1000000, icon: '⛏️' },
                    { id: 'c11', name: 'DeFi протокол', profit: 100000, price: 2500000, icon: '💎' },
                    { id: 'c12', name: 'NFT коллекция', profit: 250000, price: 5000000, icon: '' }
                ]
            }
        ];

        // Tasks Data
        const tasksData = [
            { id: 't1', name: 'Подписаться на Telegram', reward: 5000, completed: false },
            { id: 't2', name: 'Подписаться на YouTube', reward: 5000, completed: false },
            { id: 't3', name: 'Пригласить 3 друзей', reward: 15000, completed: false },
            { id: 't4', name: 'Купить 5 карт', reward: 10000, completed: false }
        ];

        // Load game
        function loadGame() {
            const saved = localStorage.getItem('hamsterCloneGame');
            if (saved) {
                gameState = JSON.parse(saved);
                // Restore cards state
                cardsData.forEach(cat => {
                    cat.items.forEach(card => {
                        const savedCard = gameState.cards.find(c => c.id === card.id);
                        if (savedCard) {
                            card.purchased = savedCard.purchased;
                        }
                    });
                });
                // Restore tasks
                gameState.tasks.forEach(savedTask => {
                    const task = tasksData.find(t => t.id === savedTask.id);
                    if (task) task.completed = savedTask.completed;
                });
            }
            updateUI();
            renderCards();
            renderTasks();
        }

        // Save game
        function saveGame() {
            gameState.cards = cardsData.flatMap(cat => 
                cat.items.map(item => ({ id: item.id, purchased: item.purchased }))
            );
            gameState.tasks = tasksData.map(t => ({ id: t.id, completed: t.completed }));
            gameState.lastSave = Date.now();
            localStorage.setItem('hamsterCloneGame', JSON.stringify(gameState));
        }

        // Update UI
        function updateUI() {
            document.getElementById('balance').textContent = Math.floor(gameState.balance).toLocaleString();
            document.getElementById('energy').textContent = Math.floor(gameState.energy);
            document.getElementById('maxEnergy').textContent = gameState.maxEnergy;
            document.getElementById('profitHour').textContent = gameState.profitPerHour.toLocaleString();
            document.getElementById('level').textContent = gameState.level;
            
            const energyPercent = (gameState.energy / gameState.maxEnergy) * 100;
            document.getElementById('energyBar').style.width = energyPercent + '%';
        }

        // Render Cards
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            cardsData.forEach(category => {
                const catDiv = document.createElement('div');
                catDiv.className = 'card-category';
                
                const totalProfit = category.items.reduce((sum, card) => 
                    sum + (card.purchased ? card.profit : 0), 0);
                
                catDiv.innerHTML = `
                    <div class="category-header">
                        <div class="category-name">${category.category}</div>
                        <div class="category-profit">+${totalProfit.toLocaleString()}/час</div>
                    </div>
                `;
                
                category.items.forEach(card => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-item' + (card.purchased ? ' purchased' : '');
                    cardDiv.innerHTML = `
                        <div class="card-info">
                            <div class="card-name">${card.icon} ${card.name}</div>
                            <div class="card-profit">+${card.profit.toLocaleString()}/час</div>
                        </div>
                        <div class="card-price">${card.purchased ? '✓' : card.price.toLocaleString() + ' 🪙'}</div>
                    `;
                    
                    if (!card.purchased) {
                        cardDiv.onclick = () => buyCard(card);
                    }
                    
                    catDiv.appendChild(cardDiv);
                });
                
                container.appendChild(catDiv);
            });
        }

        // Buy Card
        function buyCard(card) {
            if (gameState.balance >= card.price && gameState.energy >= 10) {
                gameState.balance -= card.price;
                gameState.energy -= 10;
                card.purchased = true;
                gameState.profitPerHour += card.profit;
                gameState.level = Math.floor(gameState.profitPerHour / 1000) + 1;
                
                updateUI();
                renderCards();
                saveGame();
                
                showModal(' Покупка!', `Вы купили ${card.name} за ${card.price.toLocaleString()} монет!`);
            } else {
                showModal('❌ Недостаточно средств', 'Накопите больше монет или восстановите энергию!');
            }
        }

        // Render Tasks
        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            
            tasksData.forEach(task => {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'task-item';
                taskDiv.innerHTML = `
                    <div class="task-info">
                        <div class="task-name">${task.name}</div>
                        <div class="task-reward">🎁 +${task.reward.toLocaleString()} монет</div>
                    </div>
                    <button class="claim-btn ${task.completed ? 'completed' : ''}" 
                            onclick="claimTask('${task.id}')" 
                            ${task.completed ? 'disabled' : ''}>
                        ${task.completed ? '✓' : 'Забрать'}
                    </button>
                `;
                container.appendChild(taskDiv);
            });
        }

        // Claim Task
        function claimTask(taskId) {
            const task = tasksData.find(t => t.id === taskId);
            if (task && !task.completed) {
                task.completed = true;
                gameState.balance += task.reward;
                updateUI();
                renderTasks();
                saveGame();
                showModal('🎁 Награда!', `Вы получили ${task.reward.toLocaleString()} монет!`);
            }
        }

        // Click Handler
        document.getElementById('hamsterBtn').addEventListener('click', (e) => {
            if (gameState.energy >= 1) {
                const clickValue = gameState.clickValue + Math.floor(gameState.profitPerHour / 100);
                gameState.balance += clickValue;
                gameState.energy -= 1;
                
                updateUI();
                
                // Click effect
                const effect = document.createElement('div');
                effect.className = 'click-effect';
                effect.textContent = '+' + clickValue;
                effect.style.left = e.clientX + 'px';
                effect.style.top = e.clientY + 'px';
                document.body.appendChild(effect);
                
                setTimeout(() => effect.remove(), 1000);
            } else {
                showModal('⚡ Нет энергии', 'Подождите восстановления энергии!');
            }
        });

        // Energy regeneration
        setInterval(() => {
            if (gameState.energy < gameState.maxEnergy) {
                gameState.energy = Math.min(gameState.maxEnergy, gameState.energy + 3);
                updateUI();
            }
        }, 1000);

        // Passive profit
        setInterval(() => {
            if (gameState.profitPerHour > 0) {
                const profit = gameState.profitPerHour / 3600; // per second
                gameState.balance += profit;
                updateUI();
            }
        }, 1000);

        // Auto-save
        setInterval(saveGame, 5000);

        // Switch Tab
        function switchTab(tab) {
            // Update nav
            document.querySelectorAll('.nav-item').forEach((item, index) => {
                item.classList.remove('active');
                if ((tab === 'exchange' && index === 0) ||
                    (tab === 'mine' && index === 1) ||
                    (tab === 'friends' && index === 2) ||
                    (tab === 'tasks' && index === 3)) {
                    item.classList.add('active');
                }
            });
            
            // Update sections
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            
            if (tab === 'exchange') {
                document.getElementById('exchangeSection').classList.add('active');
            } else if (tab === 'mine') {
                document.getElementById('mineSection').classList.add('active');
            } else if (tab === 'friends') {
                document.getElementById('friendsSection').classList.add('active');
            } else if (tab === 'tasks') {
                document.getElementById('tasksSection').classList.add('active');
            }
        }

        // Invite Friend
        function inviteFriend() {
            if (navigator.share) {
                navigator.share({
                    title: 'Hamster Clone',
                    text: 'Присоединяйся к Hamster Clone и зарабатывай монеты!',
                    url: window.location.href
                });
            } else {
                showModal('📩 Пригласить друга', 'Скопируй ссылку и отправь другу:\n\n' + window.location.href);
            }
        }

        // Modal
        function showModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Init
        loadGame();
        
        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
