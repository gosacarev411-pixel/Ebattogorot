<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Tap Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e2a4a 0%, #0b1020 70%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
    overflow: hidden;
  }
  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .user {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    opacity: 0.9;
  }
  .user .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #ffb347, #ffcc33);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #222;
  }
  .level {
    background: rgba(255,255,255,0.08);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .balance {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 42px;
    font-weight: 800;
    margin: 16px 0 6px;
    letter-spacing: -1px;
  }
  .coin-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe27a, #f5a623 70%, #b47a00);
    box-shadow: 0 0 20px rgba(245,166,35,0.5), inset -4px -4px 8px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .per-tap { font-size: 13px; opacity: 0.7; margin-bottom: 20px; }

  .tap-area {
    position: relative;
    width: 280px; height: 280px;
    margin: 10px 0 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .tap-btn {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd86b 0%, #f5a623 45%, #8a5a00 100%);
    border: none;
    box-shadow:
      0 20px 40px rgba(245,166,35,0.35),
      inset -10px -10px 30px rgba(0,0,0,0.35),
      inset 10px 10px 20px rgba(255,255,255,0.2);
    cursor: pointer;
    transition: transform 0.08s ease;
    display: flex; align-items: center; justify-content: center;
    font-size: 120px;
    color: #fff;
    text-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  .tap-btn:active { transform: scale(0.96); }
  .tap-btn.pulse { animation: pulse 0.25s ease; }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(0.94); }
    100% { transform: scale(1); }
  }

  .float-num {
    position: absolute;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -120px) scale(1.5); }
  }

  .energy {
    width: 100%;
    max-width: 320px;
    margin-bottom: 20px;
  }
  .energy-label {
    display: flex; justify-content: space-between;
    font-size: 13px; margin-bottom: 6px; opacity: 0.85;
  }
  .energy-bar {
    height: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
  }
  .energy-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ade80, #22c55e);
    border-radius: 10px;
    transition: width 0.2s ease;
  }

  .upgrades {
    width: 100%;
    max-width: 420px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: auto;
  }
  .upgrade {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .upgrade:active { transform: scale(0.97); }
  .upgrade.disabled { opacity: 0.5; cursor: not-allowed; }
  .upgrade .title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .upgrade .desc { font-size: 11px; opacity: 0.7; margin-bottom: 8px; }
  .upgrade .price {
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; font-weight: 700;
  }
  .upgrade .price .mini-coin {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe27a, #f5a623);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="user">
      <div class="avatar" id="avatar">?</div>
      <div id="username">Игрок</div>
    </div>
    <div class="level" id="level">Уровень 1</div>
  </div>

  <div class="balance">
    <div class="coin-icon">💰</div>
    <div id="balance">0</div>
  </div>
  <div class="per-tap">+<span id="perTap">1</span> за тап</div>

  <div class="tap-area" id="tapArea">
    <button class="tap-btn" id="tapBtn">🪙</button>
  </div>

  <div class="energy">
    <div class="energy-label">
      <span>⚡ Энергия</span>
      <span><span id="energy">1000</span> / <span id="maxEnergy">1000</span></span>
    </div>
    <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
  </div>

  <div class="upgrades">
    <div class="upgrade" id="upgMultitap">
      <div class="title">👆 Мульти-тап</div>
      <div class="desc">Уровень <span id="multitapLvl">1</span></div>
      <div class="price"><div class="mini-coin"></div><span id="multitapPrice">100</span></div>
    </div>
    <div class="upgrade" id="upgEnergy">
      <div class="title">🔋 Батарея</div>
      <div class="desc">Уровень <span id="energyLvl">1</span></div>
      <div class="price"><div class="mini-coin"></div><span id="energyPrice">100</span></div>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor?.('#0b1020');
    tg.setBackgroundColor?.('#0b1020');
  }

  // Состояние
  const state = {
    balance: 0,
    perTap: 1,
    energy: 1000,
    maxEnergy: 1000,
    multitapLvl: 1,
    energyLvl: 1,
    lastTick: Date.now(),
  };

  // Загрузка
  const saved = JSON.parse(localStorage.getItem('tapcoin') || '{}');
  Object.assign(state, saved);

  // Восстановление энергии оффлайн
  const now = Date.now();
  const offlineSec = Math.floor((now - (state.lastTick || now)) / 1000);
  state.energy = Math.min(state.maxEnergy, state.energy + offlineSec);
  state.lastTick = now;

  // UI элементы
  const $ = id => document.getElementById(id);
  const balanceEl = $('balance');
  const perTapEl = $('perTap');
  const energyEl = $('energy');
  const maxEnergyEl = $('maxEnergy');
  const energyFill = $('energyFill');
  const tapBtn = $('tapBtn');
  const tapArea = $('tapArea');
  const avatar = $('avatar');
  const username = $('username');

  // Пользователь
  if (tg?.initDataUnsafe?.user) {
    const u = tg.initDataUnsafe.user;
    username.textContent = u.first_name || 'Игрок';
    avatar.textContent = (u.first_name || '?')[0].toUpperCase();
  }

  function render() {
    balanceEl.textContent = state.balance.toLocaleString('ru-RU');
    perTapEl.textContent = state.perTap;
    energyEl.textContent = state.energy;
    maxEnergyEl.textContent = state.maxEnergy;
    energyFill.style.width = (state.energy / state.maxEnergy * 100) + '%';

    const mPrice = Math.floor(100 * Math.pow(2, state.multitapLvl - 1));
    const ePrice = Math.floor(100 * Math.pow(2, state.energyLvl - 1));
    $('multitapLvl').textContent = state.multitapLvl;
    $('energyLvl').textContent = state.energyLvl;
    $('multitapPrice').textContent = mPrice.toLocaleString('ru-RU');
    $('energyPrice').textContent = ePrice.toLocaleString('ru-RU');

    $('upgMultitap').classList.toggle('disabled', state.balance < mPrice);
    $('upgEnergy').classList.toggle('disabled', state.balance < ePrice);

    const lvl = Math.floor(Math.log10(state.balance + 1)) + 1;
    $('level').textContent = 'Уровень ' + lvl;
  }

  function save() {
    state.lastTick = Date.now();
    localStorage.setItem('tapcoin', JSON.stringify(state));
    // Отправка на сервер (если есть бэкенд)
    if (tg) tg.sendData?.(JSON.stringify({ type: 'save', ...state }));
  }

  // Тап
  function tap(e) {
    if (state.energy < state.perTap) {
      tg?.HapticFeedback?.notificationOccurred('error');
      return;
    }
    state.balance += state.perTap;
    state.energy -= state.perTap;

    // Анимация +N
    const rect = tapArea.getBoundingClientRect();
    const x = (e.touches?.[0]?.clientX ?? e.clientX) - rect.left;
    const y = (e.touches?.[0]?.clientY ?? e.clientY) - rect.top;
    const float = document.createElement('div');
    float.className = 'float-num';
    float.textContent = '+' + state.perTap;
    float.style.left = x + 'px';
    float.style.top = y + 'px';
    tapArea.appendChild(float);
    setTimeout(() => float.remove(), 1000);

    tapBtn.classList.remove('pulse');
    void tapBtn.offsetWidth;
    tapBtn.classList.add('pulse');

    tg?.HapticFeedback?.impactOccurred('light');
    render();
  }

  tapBtn.addEventListener('click', tap);

  // Апгрейды
  $('upgMultitap').addEventListener('click', () => {
    const price = Math.floor(100 * Math.pow(2, state.multitapLvl - 1));
    if (state.balance < price) return;
    state.balance -= price;
    state.multitapLvl++;
    state.perTap = state.multitapLvl;
    tg?.HapticFeedback?.notificationOccurred('success');
    render(); save();
  });

  $('upgEnergy').addEventListener('click', () => {
    const price = Math.floor(100 * Math.pow(2, state.energyLvl - 1));
    if (state.balance < price) return;
    state.balance -= price;
    state.energyLvl++;
    state.maxEnergy = 1000 * state.energyLvl;
    state.energy = state.maxEnergy;
    tg?.HapticFeedback?.notificationOccurred('success');
    render(); save();
  });

  // Восстановление энергии 1 ед/сек
  setInterval(() => {
    if (state.energy < state.maxEnergy) {
      state.energy = Math.min(state.maxEnergy, state.energy + 1);
      render();
    }
  }, 1000);

  // Автосохранение каждые 5 сек
  setInterval(save, 5000);

  render();
</script>
</body>
</html>
