<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путь от бомжа до миллионера</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .balance-display {
            text-align: center;
            margin: 20px 0;
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .balance {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            color: #ffd700;
        }

        .income-info {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .income-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 15px;
            text-align: center;
        }

        .income-label {
            font-size: 12px;
            opacity: 0.7;
        }

        .income-value {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }

        /* Main Clicker */
        .clicker-section {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clicker-btn {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.4), inset 0 -10px 30px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            border: 8px solid #fff;
            margin: 20px 0;
        }

        .clicker-btn:active {
            transform: scale(0.95);
        }

        .click-effect {
            position: fixed;
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-150px) scale(1.5); }
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Business Cards */
        .business-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .business-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .business-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: #667eea;
        }

        .business-card.affordable {
            border-color: #00ff88;
        }

        .business-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .business-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .business-income {
            color: #00ff88;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .business-price {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
        }

        .business-level {
            float: right;
            background: rgba(102, 126, 234, 0.5);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
        }

        /* Tasks */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .task-item.completed {
            opacity: 0.6;
            border-color: #00ff88;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .task-description {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .task-reward {
            color: #ffd700;
            font-weight: bold;
        }

        .task-btn {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .task-btn:hover {
            transform: scale(1.05);
        }

        .task-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: not-allowed;
        }

        /* Achievements */
        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .achievement-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .achievement-card.unlocked {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .achievement-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .achievement-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .achievement-desc {
            font-size: 12px;
            opacity: 0.7;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 2px solid #ffd700;
            animation: modalSlide 0.3s;
        }

        @keyframes modalSlide {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd700;
        }

        .modal-text {
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.5;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        /* Event Notification */
        .event-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1500;
            animation: slideIn 0.5s, slideOut 0.5s 4.5s forwards;
            max-width: 300px;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); }
            to { transform: translateX(0); }
        }

        @keyframes slideOut {
            to { transform: translateX(400px); opacity: 0; }
        }

        .event-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .event-desc {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .balance {
                font-size: 36px;
            }
            
            .clicker-btn {
                width: 200px;
                height: 200px;
                font-size: 80px;
            }
            
            .business-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="status-bar">
                <div class="status-badge" id="statusBadge">🏚️ Бомж</div>
                <div style="font-size: 14px; opacity: 0.8;">Уровень: <span id="levelDisplay">1</span></div>
            </div>
            
            <div class="balance-display">
                <div class="balance-label">Ваш капитал</div>
                <div class="balance" id="balanceDisplay">0 ₽</div>
            </div>
            
            <div class="income-info">
                <div class="income-item">
                    <div class="income-label">За клик</div>
                    <div class="income-value" id="clickIncome">+1 ₽</div>
                </div>
                <div class="income-item">
                    <div class="income-label">В секунду</div>
                    <div class="income-value" id="passiveIncome">+0 ₽</div>
                </div>
                <div class="income-item">
                    <div class="income-label">Всего заработано</div>
                    <div class="income-value" id="totalEarned">0 ₽</div>
                </div>
            </div>
        </div>

        <!-- Clicker Section -->
        <div class="clicker-section">
            <h2 style="margin-bottom: 20px;">Работай и зарабатывай!</h2>
            <div class="clicker-btn" id="clickerBtn">💪</div>
            <p style="opacity: 0.8;">Тапай, чтобы зарабатывать деньги</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('business')">🏢 Бизнесы</button>
            <button class="tab-btn" onclick="switchTab('tasks')">📋 Задания</button>
            <button class="tab-btn" onclick="switchTab('achievements')">🏆 Достижения</button>
            <button class="tab-btn" onclick="switchTab('stats')">📊 Статистика</button>
        </div>

        <!-- Business Tab -->
        <div id="businessTab" class="tab-content active">
            <h2 style="margin-bottom: 20px;">Купи бизнес и получай пассивный доход</h2>
            <div class="business-grid" id="businessGrid"></div>
        </div>

        <!-- Tasks Tab -->
        <div id="tasksTab" class="tab-content">
            <h2 style="margin-bottom: 20px;">Выполняй задания и получай награды</h2>
            <div class="task-list" id="taskList"></div>
        </div>

        <!-- Achievements Tab -->
        <div id="achievementsTab" class="tab-content">
            <h2 style="margin-bottom: 20px;">Твои достижения</h2>
            <div class="achievement-grid" id="achievementGrid"></div>
        </div>

        <!-- Stats Tab -->
        <div id="statsTab" class="tab-content">
            <h2 style="margin-bottom: 20px;">Статистика игры</h2>
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle"> Поздравляем!</div>
            <div class="modal-text" id="modalText"></div>
            <button class="modal-btn" onclick="closeModal()">Продолжить</button>
        </div>
    </div>

    <script>
        // Game State
        let gameState = {
            balance: 0,
            totalEarned: 0,
            totalClicks: 0,
            clickPower: 1,
            passiveIncome: 0,
            level: 1,
            businesses: {},
            tasksCompleted: [],
            achievementsUnlocked: [],
            startTime: Date.now(),
            lastSave: Date.now()
        };

        // Status Levels
        const statusLevels = [
            { name: 'Бомж', icon: '️', threshold: 0 },
            { name: 'Нищий', icon: '😢', threshold: 1000 },
            { name: 'Бедняк', icon: '😟', threshold: 10000 },
            { name: 'Рабочий', icon: '', threshold: 100000 },
            { name: 'Средний класс', icon: '👔', threshold: 1000000 },
            { name: 'Богач', icon: '💼', threshold: 10000000 },
            { name: 'Миллионер', icon: '🤑', threshold: 100000000 },
            { name: 'Мультимиллионер', icon: '💎', threshold: 1000000000 },
            { name: 'Миллиардер', icon: '👑', threshold: 10000000000 },
            { name: 'Олигарх', icon: '🏆', threshold: 100000000000 },
            { name: 'Магнат', icon: '🌟', threshold: 1000000000000 },
            { name: 'Легенда', icon: '⚡', threshold: 10000000000000 }
        ];

        // Businesses
        const businesses = [
            { id: 'lemonade', name: 'Ларёк с лимонадом', icon: '🍋', basePrice: 100, income: 1 },
            { id: 'newspaper', name: 'Газетный киоск', icon: '📰', basePrice: 500, income: 5 },
            { id: 'carwash', name: 'Автомойка', icon: '🚗', basePrice: 2000, income: 20 },
            { id: 'cafe', name: 'Кафе', icon: '☕', basePrice: 10000, income: 100 },
            { id: 'shop', name: 'Магазин', icon: '', basePrice: 50000, income: 500 },
            { id: 'restaurant', name: 'Ресторан', icon: '🍽️', basePrice: 200000, income: 2000 },
            { id: 'hotel', name: 'Отель', icon: '🏨', basePrice: 1000000, income: 10000 },
            { id: 'casino', name: 'Казино', icon: '🎰', basePrice: 5000000, income: 50000 },
            { id: 'bank', name: 'Банк', icon: '🏦', basePrice: 25000000, income: 250000 },
            { id: 'oil', name: 'Нефтяная компания', icon: '⛽', basePrice: 100000000, income: 1000000 },
            { id: 'tech', name: 'IT-корпорация', icon: '💻', basePrice: 500000000, income: 5000000 },
            { id: 'space', name: 'Космическая компания', icon: '🚀', basePrice: 2500000000, income: 25000000 }
        ];

        // Tasks
        const tasks = [
            { id: 't1', name: 'Первые шаги', description: 'Заработай 1000 ₽', reward: 500, check: () => gameState.totalEarned >= 1000 },
            { id: 't2', name: 'Трудяга', description: 'Сделай 100 кликов', reward: 1000, check: () => gameState.totalClicks >= 100 },
            { id: 't3', name: 'Предприниматель', description: 'Купи первый бизнес', reward: 2000, check: () => Object.keys(gameState.businesses).length > 0 },
            { id: 't4', name: 'Тысячник', description: 'Заработай 10,000 ₽', reward: 5000, check: () => gameState.totalEarned >= 10000 },
            { id: 't5', name: 'Бизнесмен', description: 'Купи 5 разных бизнесов', reward: 10000, check: () => Object.keys(gameState.businesses).length >= 5 },
            { id: 't6', name: 'Миллионер', description: 'Накопи 1,000,000 ₽', reward: 50000, check: () => gameState.balance >= 1000000 },
            { id: 't7', name: 'Кликер-мастер', description: 'Сделай 1000 кликов', reward: 20000, check: () => gameState.totalClicks >= 1000 },
            { id: 't8', name: 'Магнат', description: 'Заработай 100,000,000 ₽', reward: 100000, check: () => gameState.totalEarned >= 100000000 },
            { id: 't9', name: 'Империя', description: 'Купи все виды бизнесов', reward: 500000, check: () => Object.keys(gameState.businesses).length >= businesses.length },
            { id: 't10', name: 'Легенда', description: 'Достигни статуса Легенда', reward: 1000000, check: () => gameState.level >= statusLevels.length }
        ];

        // Achievements
        const achievements = [
            { id: 'a1', name: 'Первые деньги', icon: '💵', description: 'Заработай первую 1000 ₽', check: () => gameState.totalEarned >= 1000 },
            { id: 'a2', name: 'Кликомания', icon: '👆', description: 'Сделай 1000 кликов', check: () => gameState.totalClicks >= 1000 },
            { id: 'a3', name: 'Бизнес-империя', icon: '', description: 'Купи 10 бизнесов', check: () => Object.keys(gameState.businesses).length >= 10 },
            { id: 'a4', name: 'Миллионер', icon: '💰', description: 'Накопи миллион', check: () => gameState.balance >= 1000000 },
            { id: 'a5', name: 'Миллиардер', icon: '💎', description: 'Накопи миллиард', check: () => gameState.balance >= 1000000000 },
            { id: 'a6', name: 'Трудоголик', icon: '', description: 'Играй 1 час', check: () => (Date.now() - gameState.startTime) >= 3600000 },
            { id: 'a7', name: 'Коллекционер', icon: '🎯', description: 'Выполни все задания', check: () => gameState.tasksCompleted.length >= tasks.length },
            { id: 'a8', name: 'Легенда', icon: '👑', description: 'Достигни максимального статуса', check: () => gameState.level >= statusLevels.length }
        ];

        // Load Game
        function loadGame() {
            const saved = localStorage.getItem('bomzhToMillionaire');
            if (saved) {
                gameState = JSON.parse(saved);
                // Restore businesses
                businesses.forEach(b => {
                    if (!gameState.businesses[b.id]) {
                        gameState.businesses[b.id] = 0;
                    }
                });
            }
            updateUI();
            renderBusinesses();
            renderTasks();
            renderAchievements();
            renderStats();
        }

        // Save Game
        function saveGame() {
            gameState.lastSave = Date.now();
            localStorage.setItem('bomzhToMillionaire', JSON.stringify(gameState));
        }

        // Update UI
        function updateUI() {
            // Calculate current status
            let currentStatus = statusLevels[0];
            for (let i = statusLevels.length - 1; i >= 0; i--) {
                if (gameState.balance >= statusLevels[i].threshold) {
                    currentStatus = statusLevels[i];
                    gameState.level = i + 1;
                    break;
                }
            }

            document.getElementById('statusBadge').textContent = `${currentStatus.icon} ${currentStatus.name}`;
            document.getElementById('levelDisplay').textContent = gameState.level;
            document.getElementById('balanceDisplay').textContent = formatMoney(gameState.balance);
            document.getElementById('clickIncome').textContent = `+${formatMoney(gameState.clickPower)} ₽`;
            document.getElementById('passiveIncome').textContent = `+${formatMoney(gameState.passiveIncome)} ₽/с`;
            document.getElementById('totalEarned').textContent = formatMoney(gameState.totalEarned);

            // Update clicker button emoji based on status
            const clickerBtn = document.getElementById('clickerBtn');
            if (gameState.level <= 2) clickerBtn.textContent = '💪';
            else if (gameState.level <= 4) clickerBtn.textContent = '👷';
            else if (gameState.level <= 6) clickerBtn.textContent = '💼';
            else if (gameState.level <= 8) clickerBtn.textContent = '🤑';
            else if (gameState.level <= 10) clickerBtn.textContent = '';
            else clickerBtn.textContent = '';
        }

        // Format Money
        function formatMoney(amount) {
            if (amount >= 1000000000000) return (amount / 1000000000000).toFixed(2) + ' трлн';
            if (amount >= 1000000000) return (amount / 1000000000).toFixed(2) + ' млрд';
            if (amount >= 1000000) return (amount / 1000000).toFixed(2) + ' млн';
            if (amount >= 1000) return (amount / 1000).toFixed(2) + ' тыс';
            return Math.floor(amount).toString();
        }

        // Click Handler
        document.getElementById('clickerBtn').addEventListener('click', (e) => {
            gameState.balance += gameState.clickPower;
            gameState.totalEarned += gameState.clickPower;
            gameState.totalClicks++;
            
            updateUI();
            checkTasks();
            checkAchievements();
            
            // Click effect
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.textContent = '+' + formatMoney(gameState.clickPower);
            effect.style.left = e.clientX + 'px';
            effect.style.top = e.clientY + 'px';
            document.body.appendChild(effect);
            
            setTimeout(() => effect.remove(), 1000);
        });

        // Render Businesses
        function renderBusinesses() {
            const grid = document.getElementById('businessGrid');
            grid.innerHTML = '';
            
            businesses.forEach(business => {
                const level = gameState.businesses[business.id] || 0;
                const price = Math.floor(business.basePrice * Math.pow(1.15, level));
                const income = business.income * (level + 1);
                
                const card = document.createElement('div');
                card.className = 'business-card' + (gameState.balance >= price ? ' affordable' : '');
                card.innerHTML = `
                    <div class="business-level">Ур. ${level}</div>
                    <div class="business-icon">${business.icon}</div>
                    <div class="business-name">${business.name}</div>
                    <div class="business-income">+${formatMoney(income)} ₽/с</div>
                    <div class="business-price">${formatMoney(price)} ₽</div>
                `;
                
                card.onclick = () => buyBusiness(business);
                grid.appendChild(card);
            });
        }

        // Buy Business
        function buyBusiness(business) {
            const level = gameState.businesses[business.id] || 0;
            const price = Math.floor(business.basePrice * Math.pow(1.15, level));
            
            if (gameState.balance >= price) {
                gameState.balance -= price;
                gameState.businesses[business.id] = level + 1;
                gameState.passiveIncome += business.income;
                gameState.clickPower += Math.floor(business.income / 10);
                
                updateUI();
                renderBusinesses();
                checkTasks();
                saveGame();
                
                showNotification(' Покупка!', `Вы купили ${business.name} (Уровень ${level + 1})`);
            } else {
                showNotification('❌ Недостаточно денег', `Нужно ещё ${formatMoney(price - gameState.balance)} ₽`);
            }
        }

        // Render Tasks
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            tasks.forEach(task => {
                const completed = gameState.tasksCompleted.includes(task.id);
                const item = document.createElement('div');
                item.className = 'task-item' + (completed ? ' completed' : '');
                item.innerHTML = `
                    <div class="task-info">
                        <div class="task-name">${task.name}</div>
                        <div class="task-description">${task.description}</div>
                        <div class="task-reward">🎁 Награда: ${formatMoney(task.reward)} ₽</div>
                    </div>
                    <button class="task-btn" ${completed ? 'disabled' : ''} onclick="claimTask('${task.id}')">
                        ${completed ? '✓ Выполнено' : 'Забрать'}
                    </button>
                `;
                list.appendChild(item);
            });
        }

        // Check Tasks
        function checkTasks() {
            tasks.forEach(task => {
                if (!gameState.tasksCompleted.includes(task.id) && task.check()) {
                    // Task is ready to claim
                }
            });
            renderTasks();
        }

        // Claim Task
        function claimTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task && !gameState.tasksCompleted.includes(taskId) && task.check()) {
                gameState.tasksCompleted.push(taskId);
                gameState.balance += task.reward;
                gameState.totalEarned += task.reward;
                
                updateUI();
                renderTasks();
                checkAchievements();
                saveGame();
                
                showModal('🎁 Задание выполнено!', `Вы получили ${formatMoney(task.reward)} ₽ за выполнение задания "${task.name}"!`);
            }
        }

        // Render Achievements
        function renderAchievements() {
            const grid = document.getElementById('achievementGrid');
            grid.innerHTML = '';
            
            achievements.forEach(achievement => {
                const unlocked = gameState.achievementsUnlocked.includes(achievement.id);
                const card = document.createElement('div');
                card.className = 'achievement-card' + (unlocked ? ' unlocked' : '');
                card.innerHTML = `
                    <div class="achievement-icon">${achievement.icon}</div>
                    <div class="achievement-name">${achievement.name}</div>
                    <div class="achievement-desc">${achievement.description}</div>
                `;
                grid.appendChild(card);
            });
        }

        // Check Achievements
        function checkAchievements() {
            achievements.forEach(achievement => {
                if (!gameState.achievementsUnlocked.includes(achievement.id) && achievement.check()) {
                    gameState.achievementsUnlocked.push(achievement.id);
                    showNotification('🏆 Достижение разблокировано!', achievement.name);
                }
            });
            renderAchievements();
        }

        // Render Stats
        function renderStats() {
            const grid = document.getElementById('statsGrid');
            const playTime = Math.floor((Date.now() - gameState.startTime) / 1000);
            const hours = Math.floor(playTime / 3600);
            const minutes = Math.floor((playTime % 3600) / 60);
            
            grid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Всего кликов</div>
                    <div class="stat-value">${gameState.totalClicks.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Всего заработано</div>
                    <div class="stat-value">${formatMoney(gameState.totalEarned)} ₽</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Бизнесов куплено</div>
                    <div class="stat-value">${Object.keys(gameState.businesses).length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Заданий выполнено</div>
                    <div class="stat-value">${gameState.tasksCompleted.length}/${tasks.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Достижений</div>
                    <div class="stat-value">${gameState.achievementsUnlocked.length}/${achievements.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Время в игре</div>
                    <div class="stat-value">${hours}ч ${minutes}м</div>
                </div>
            `;
        }

        // Switch Tab
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            if (tab === 'stats') renderStats();
        }

        // Show Modal
        function showModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Show Notification
        function showNotification(title, desc) {
            const notif = document.createElement('div');
            notif.className = 'event-notification';
            notif.innerHTML = `
                <div class="event-title">${title}</div>
                <div class="event-desc">${desc}</div>
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 5000);
        }

        // Passive Income
        setInterval(() => {
            if (gameState.passiveIncome > 0) {
                gameState.balance += gameState.passiveIncome;
                gameState.totalEarned += gameState.passiveIncome;
                updateUI();
                checkTasks();
                checkAchievements();
            }
        }, 1000);

        // Auto-save
        setInterval(saveGame, 10000);

        // Random Events
        setInterval(() => {
            if (Math.random() < 0.1 && gameState.balance > 0) {
                const events = [
                    { title: '🎁 Бонус!', desc: 'Вы нашли ' + formatMoney(gameState.passiveIncome * 10) + ' ₽!', effect: () => { gameState.balance += gameState.passiveIncome * 10; } },
                    { title: '💼 Инвестиция', desc: 'Ваши акции выросли! +' + formatMoney(gameState.balance * 0.05) + ' ₽', effect: () => { gameState.balance += gameState.balance * 0.05; } },
                    { title: '🎰 Удача!', desc: 'Вы выиграли в лотерею! +' + formatMoney(1000) + ' ₽', effect: () => { gameState.balance += 1000; } }
                ];
                
                const event = events[Math.floor(Math.random() * events.length)];
                event.effect();
                updateUI();
                showNotification(event.title, event.desc);
            }
        }, 30000);

        // Init
        loadGame();
    </script>
</body>
</html>
